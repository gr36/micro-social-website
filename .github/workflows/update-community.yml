name: Update community suggestions

on:
  schedule:
    - cron: "0 6 * * 1"     # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 community/update.py
        env:
          MICROBLOG_TOKEN: ${{ secrets.MICROBLOG_TOKEN }}
      - run: python3 community/validate.py community/feed.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add community/feed.json
          git diff --cached --quiet || git commit -m "Update community suggestions"
          git push
