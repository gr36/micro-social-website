name: Validate community feed

on:
  push:
    paths:
      - "static/community/**"
      - "community/**"
  pull_request:
    paths:
      - "static/community/**"
      - "community/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 community/validate.py static/community/feed.json
